<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  :root { --ink:#17252b; --paper:#e8e0d1; --accent:#9aad5a; }
  * { box-sizing:border-box; }
  body { margin:0; width:800px; height:1000px; background:var(--ink); color:var(--paper); font:16px system-ui,sans-serif; }
  .plate { width:100%; height:100%; padding:64px; display:flex; flex-direction:column; justify-content:space-between; background:radial-gradient(circle at 70% 18%, var(--accent), transparent 34%), var(--ink); }
  .eyebrow { font-size:12px; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
  h1 { max-width:560px; margin:0; font:500 76px/0.95 Georgia,serif; letter-spacing:-.05em; }
  .line { width:100%; height:1px; background:currentColor; opacity:.35; }
  .footer { display:flex; justify-content:space-between; font-size:13px; opacity:.75; }
</style>
<body>
  <main class="plate">
    <div class="eyebrow">Palette reference / <span id="name">Lefos</span></div>
    <h1 id="title">Quiet field.<br>Clear signal.</h1>
    <div class="line"></div>
    <div class="footer"><span id="note">Organic geometry, soft contrast</span><span>01 / 05</span></div>
  </main>
  <script>
    const themes = {
      lefos: ["Lefos", "Quiet field.<br>Clear signal.", "#708a9e", "Organic geometry, soft contrast"],
      betterhelp: ["BetterHelp", "Warm care.<br>Open room.", "#b9a58d", "Human warmth, steady trust"],
      omarchy: ["Omarchy", "Dark shell.<br>Bright utility.", "#b7d36b", "Terminal energy, focused action"],
      signals: ["37signals", "Plain words.<br>Strong red.", "#cf5b49", "Editorial clarity, direct action"],
      huts: ["Huts", "Field notes.<br>Slow rhythm.", "#89956b", "Moss, walnut, paper"],
    };
    const key = location.hash.slice(1) || "lefos";
    const theme = themes[key] || themes.lefos;
    document.documentElement.style.setProperty("--accent", theme[2]);
    name.textContent = theme[0]; title.innerHTML = theme[1]; note.textContent = theme[3];
  </script>
</html>
